spring.application.name=dynamic-api-generator

# Database connection – set DB_URL, DB_USERNAME and DB_PASSWORD as environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dynamic_api_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

server.error.include-message=always
